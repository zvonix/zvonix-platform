<title>Консоль Zvonix</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
/>

<style>
  :root {
    --ground: #eef2f5;
    --surface: #ffffff;
    --sunk: #e4eaef;
    --rail: #1b2732;
    --rail-ink: #c3d0dc;
    --rail-ink-dim: #90a0af;
    --rail-active: #263646;
    --border: #d3dbe2;
    --border-soft: #e3e9ee;
    --ink: #101c26;
    --muted: #475766;
    --faint: #5a6975;

    --accent: #b4622f;
    --accent-soft: #f5e4d8;

    --ok: #2c8f62;
    --ok-soft: #dcefe5;
    --warn: #a8791a;
    --warn-soft: #f7edd3;
    --crit: #b53e36;
    --crit-soft: #f8dedc;

    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ground: #0b1116;
      --surface: #131c24;
      --sunk: #0e161d;
      --rail: #0d151c;
      --rail-ink: #b7c6d4;
      --rail-ink-dim: #8092a3;
      --rail-active: #1c2935;
      --border: #22303c;
      --border-soft: #1a252f;
      --ink: #e3ebf2;
      --muted: #8ca0b1;
      --faint: #758698;
      --accent: #dd8b53;
      --accent-soft: #3a2418;
      --ok: #46b585;
      --ok-soft: #14291f;
      --warn: #d4a744;
      --warn-soft: #2a2212;
      --crit: #dc6d64;
      --crit-soft: #2d1714;
      color-scheme: dark;
    }
  }

  :root[data-theme='dark'] {
    --ground: #0b1116;
    --surface: #131c24;
    --sunk: #0e161d;
    --rail: #0d151c;
    --rail-ink: #b7c6d4;
    --rail-ink-dim: #8092a3;
    --rail-active: #1c2935;
    --border: #22303c;
    --border-soft: #1a252f;
    --ink: #e3ebf2;
    --muted: #8ca0b1;
    --faint: #758698;
    --accent: #dd8b53;
    --accent-soft: #3a2418;
    --ok: #46b585;
    --ok-soft: #14291f;
    --warn: #d4a744;
    --warn-soft: #2a2212;
    --crit: #dc6d64;
    --crit-soft: #2d1714;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  .num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  :where(button, input, select, [tabindex]):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* ============ Каркас ============ */

  .app {
    display: grid;
    grid-template-columns: 224px 1fr;
    height: 100vh;
  }

  @media (max-width: 900px) {
    .app {
      grid-template-columns: 58px 1fr;
    }
    .rail .label,
    .rail .group-title,
    .rail .brand span,
    .rail .count {
      display: none;
    }
    .rail a {
      justify-content: center;
    }
  }

  /* ---- Боковое меню ---- */

  .rail {
    background: var(--rail);
    color: var(--rail-ink);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .rail .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid rgb(255 255 255 / 0.07);
  }

  .rail .brand b {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
  }

  .rail .brand span {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--rail-ink-dim);
  }

  .rail .group-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--rail-ink-dim);
    padding: 14px 16px 5px;
  }

  .rail a {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 16px;
    color: var(--rail-ink);
    text-decoration: none;
    font-size: 13px;
    border-left: 2px solid transparent;
    cursor: pointer;
  }

  .rail a:hover {
    background: var(--rail-active);
  }

  .rail a[aria-current='page'] {
    background: var(--rail-active);
    border-left-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }

  .rail .ico {
    width: 15px;
    text-align: center;
    font-size: 12px;
    color: var(--rail-ink-dim);
    flex: none;
  }

  .rail a[aria-current='page'] .ico {
    color: var(--accent);
  }

  .rail .label {
    flex: 1;
  }

  .rail .count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--rail-ink-dim);
  }

  .rail .count.bad {
    color: var(--crit);
    font-weight: 600;
  }

  .rail-foot {
    margin-top: auto;
    padding: 12px 16px;
    border-top: 1px solid rgb(255 255 255 / 0.07);
    font-size: 11px;
    color: var(--rail-ink-dim);
  }

  /* ---- Правая часть ---- */

  .main {
    display: grid;
    grid-template-rows: auto 1fr;
    min-width: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    height: 46px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .topbar h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
  }

  .topbar .crumb {
    color: var(--faint);
    font-size: 12px;
    white-space: nowrap;
  }

  .spacer {
    flex: 1;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--sunk);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0 8px;
    height: 27px;
    min-width: 180px;
  }

  .search input {
    border: 0;
    background: none;
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    outline: none;
    width: 100%;
  }

  .search span {
    color: var(--faint);
    font-size: 12px;
  }

  .roles {
    display: flex;
    gap: 1px;
    background: var(--sunk);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px;
  }

  .roles button {
    font: inherit;
    font-size: 12px;
    padding: 3px 10px;
    border: 0;
    border-radius: 4px;
    background: none;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }

  .roles button[aria-selected='true'] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 500;
  }

  .content {
    overflow: auto;
    padding: 14px 16px 40px;
  }

  /* ---- Панель инструментов ---- */

  .toolbar {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .btn {
    font: inherit;
    font-size: 12.5px;
    height: 27px;
    padding: 0 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .btn:hover {
    border-color: var(--faint);
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.on {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 500;
  }

  select.btn {
    padding-right: 6px;
  }

  .count-note {
    font-size: 12px;
    color: var(--faint);
    margin-left: auto;
  }

  /* ---- Таблицы ---- */

  .tablewrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: auto;
    max-height: calc(100vh - 190px);
  }

  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    font-size: 12.5px;
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--surface);
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--faint);
    text-align: left;
    padding: 7px 10px;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  thead th.r,
  td.r {
    text-align: right;
  }

  tbody td {
    padding: 5px 10px;
    border-bottom: 1px solid var(--border-soft);
    white-space: nowrap;
  }

  tbody tr:hover td {
    background: var(--sunk);
  }

  tbody tr.sel td {
    background: var(--accent-soft);
  }

  tbody tr {
    cursor: pointer;
  }

  .pager {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 2px 0;
    font-size: 12px;
    color: var(--faint);
  }

  /* ---- Мелкие элементы ---- */

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 500;
    padding: 1px 7px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .pill::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  .p-ok {
    background: var(--ok-soft);
    color: var(--ok);
  }
  .p-warn {
    background: var(--warn-soft);
    color: var(--warn);
  }
  .p-crit {
    background: var(--crit-soft);
    color: var(--crit);
  }
  .p-idle {
    background: var(--sunk);
    color: var(--faint);
  }

  .alias {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 0 5px;
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  .bad {
    color: var(--crit);
  }
  .good {
    color: var(--ok);
  }

  /* ---- Плитки ---- */

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
    gap: 9px;
    margin-bottom: 12px;
  }

  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
  }

  .kpi .k {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--faint);
  }

  .kpi .v {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -0.03em;
    margin-top: 2px;
  }

  .kpi .s {
    font-size: 11.5px;
    color: var(--muted);
  }

  .grid2 {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 12px;
    align-items: start;
  }

  @media (max-width: 1100px) {
    .grid2 {
      grid-template-columns: 1fr;
    }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .card > h2 {
    margin: 0;
    padding: 9px 12px;
    font-size: 12px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
  }

  .card > h2 em {
    font-style: normal;
    font-size: 11px;
    font-weight: 400;
    color: var(--faint);
  }

  .cell {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: center;
    border: 0;
    background: none;
    font-size: 12px;
    color: inherit;
    padding: 3px 0;
    width: 100%;
    border-radius: 3px;
    cursor: pointer;
  }

  .lvl-ok {
    background: var(--ok-soft);
    color: var(--ok);
  }
  .lvl-warn {
    background: var(--warn-soft);
    color: var(--warn);
  }
  .lvl-crit {
    background: var(--crit-soft);
    color: var(--crit);
    font-weight: 600;
  }

  .readout {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    background: var(--sunk);
  }

  .readout b {
    color: var(--ink);
  }

  .list {
    padding: 4px 0;
  }

  .list .row {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 5px 12px;
    font-size: 12.5px;
  }

  .list .row + .row {
    border-top: 1px solid var(--border-soft);
  }

  .list .row .t {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
    flex: none;
  }

  .list .row .x {
    flex: 1;
    color: var(--muted);
  }

  /* ---- Панель детали ---- */

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 380px;
    max-width: 92vw;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgb(0 0 0 / 0.12);
    display: flex;
    flex-direction: column;
    z-index: 20;
  }

  .drawer[hidden] {
    display: none;
  }

  .drawer header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  .drawer header b {
    font-size: 13px;
  }

  .drawer .body {
    overflow: auto;
    padding: 12px;
  }

  .drawer dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 4px 12px;
    margin: 0 0 12px;
    font-size: 12.5px;
  }

  .drawer dt {
    color: var(--faint);
  }

  .drawer dd {
    margin: 0;
  }

  .why {
    background: var(--sunk);
    border-radius: 5px;
    padding: 9px 11px;
    font-size: 12.5px;
    color: var(--ink);
    line-height: 1.45;
  }

  .why h4 {
    margin: 0 0 5px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--faint);
    font-weight: 600;
  }

  .rejected {
    margin-top: 10px;
    font-size: 12.5px;
  }

  .rejected div {
    padding: 3px 0;
    border-bottom: 1px solid var(--border-soft);
    color: var(--muted);
  }

  /* ---- Телефон партнёра ---- */

  .phone-grid {
    display: grid;
    grid-template-columns: 330px 1fr;
    gap: 16px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .phone-grid {
      grid-template-columns: 1fr;
    }
  }

  .phone {
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    padding: 8px;
  }

  .phone-in {
    background: var(--ground);
    border-radius: 12px;
    padding: 11px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .earn {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }

  .earn > div {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 7px 9px;
  }

  .earn .k {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--faint);
  }

  .earn .v {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .ports {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .port {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 2px;
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.3;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }

  .port .op {
    display: block;
    font-weight: 600;
    font-size: 10.5px;
    color: var(--ink);
  }

  .port.busy {
    border-color: var(--ok);
    background: var(--ok-soft);
  }
  .port.busy .op {
    color: var(--ok);
  }
  .port.blocked {
    border-color: var(--crit);
    background: var(--crit-soft);
  }
  .port.blocked .op {
    color: var(--crit);
  }
  .port.empty {
    border-style: dashed;
    color: var(--faint);
  }

  .gw {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 9px;
  }

  .gw-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
    font-size: 12.5px;
    font-weight: 600;
  }

  .note {
    display: flex;
    gap: 7px;
    padding: 8px 10px;
    border-radius: 5px;
    font-size: 12px;
    line-height: 1.4;
  }

  .note.crit {
    background: var(--crit-soft);
    color: var(--crit);
  }
  .note.warn {
    background: var(--warn-soft);
    color: var(--warn);
  }
  .note b {
    font-weight: 600;
  }
  .note .bd {
    color: var(--ink);
  }

  .hint {
    font-size: 12.5px;
    color: var(--muted);
    max-width: 48ch;
  }

  .hint h3 {
    font-size: 12.5px;
    color: var(--ink);
    margin: 0 0 4px;
  }

  .hint + .hint {
    margin-top: 14px;
  }

  .bar {
    height: 6px;
    background: var(--sunk);
    border-radius: 3px;
    overflow: hidden;
    min-width: 60px;
  }

  .bar span {
    display: block;
    height: 100%;
    background: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>

<div class="app">
  <nav class="rail">
    <div class="brand"><b>Zvonix</b><span>консоль</span></div>
    <div id="nav"></div>
    <div class="rail-foot">Прототип на выдуманных данных</div>
  </nav>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Обзор</h1>
      <span class="crumb" id="page-crumb"></span>
      <div class="spacer"></div>
      <label class="search"
        ><span>⌕</span
        ><input type="search" placeholder="номер, партнёр, SIM, вызов…" aria-label="Поиск"
      /></label>
      <div class="roles" role="tablist" aria-label="Роль">
        <button role="tab" aria-selected="true" data-role="admin">Админ</button>
        <button role="tab" aria-selected="false" data-role="partner">Партнёр</button>
        <button role="tab" aria-selected="false" data-role="client">Клиент</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Карточка вызова">
  <header>
    <b id="drawer-title">Вызов</b><span class="spacer"></span>
    <button class="btn" id="drawer-close" type="button">Закрыть</button>
  </header>
  <div class="body" id="drawer-body"></div>
</aside>

<script>
  'use strict';

  const $ = (id) => document.getElementById(id);
  const esc = (s) =>
    String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

  /* ================= ДАННЫЕ ================= */

  const REGIONS = [
    'Москва',
    'Санкт-Петербург',
    'Свердловская',
    'Новосибирская',
    'Краснодарский',
    'Татарстан',
  ];

  const COVERAGE = [
    { op: 'МТС', free: [14, 9, 6, 4, 7, 5], by: 'Синий-14, Кедр-07, Ясень-31' },
    { op: 'Т2', free: [11, 7, 3, 2, 5, 4], by: 'Синий-14, Гранит-02' },
    { op: 'Мегафон', free: [8, 5, 0, 1, 3, 2], by: 'Кедр-07' },
    { op: 'Билайн', free: [2, 1, 0, 0, 1, 0], by: 'Гранит-02' },
    { op: 'Йота', free: [4, 3, 2, 1, 2, 1], by: 'Ясень-31' },
  ];

  const OPS = ['МТС', 'Т2', 'Мегафон', 'Билайн', 'Йота'];
  const ALIASES = [
    'Синий-14',

    for (let i = 0; i < n; i += 1) {

      const fail = failEvery ? CALL_FAILS[i % CALL_FAILS.length] : null;
      const dur = 20 + ((i * 37) % 260);
      const op = OPS[i % OPS.length];
      const alias = ALIASES[i % ALIASES.length];
      const cost = (dur / 60) * (1.05 + (i % 5) * 0.06);
      out.push({
        time: fmtClock(sec),
        number: mask(
          '+7 9' +
            String(13 + (i % 60)).padStart(2, '0') +
            ' ' +
            String(100 + ((i * 7) % 900)) +
            '-' +
            String(10 + (i % 90)) +

            String(10 + ((i * 3) % 90)),
        ),
        client: CLIENTS[i % CLIENTS.length],
        channel: CHANNELS[i % CHANNELS.length],
        op: fail && fail.rej ? op : op,
        partner: fail ? '—' : alias,
        dur: fail ? '—' : fmtDur(dur),
        cost: fail ? '0,00' : cost.toFixed(2).replace('.', ','),

            ' дней.',
        rej: fail ? fail.rej : null,
      });
      sec -= 7 + ((i * 13) % 40);
    }
    return out;

      '</dd>' +
      '<dt>Длительность</dt><dd class="num">' +
      c.dur +
      '</dd>' +
      '<dt>Списано</dt><dd class="num">' +
      c.cost +
      ' ₽</dd>' +
      '<dt>Итог</dt><dd>' +
      pill(c.st) +
      '</dd>' +
      '</dl>' +
      '<div class="why"><h4>Решение маршрутизации</h4>' +
      esc(c.why) +
      '</div>' +
      (c.rej
        ? '<div class="rejected"><h4 style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:12px 0 4px">Кто отпал</h4>' +
          c.rej.map((r) => '<div>' + esc(r) + '</div>').join('') +
          '</div>'
        : '');
    $('drawer').hidden = false;
  }

  $('drawer-close').addEventListener('click', () => {
    $('drawer').hidden = true;
  });

  document.querySelectorAll('.roles button').forEach((b) => {
    b.addEventListener('click', () => {
      document
        .querySelectorAll('.roles button')
        .forEach((o) => o.setAttribute('aria-selected', String(o === b)));
      role = b.dataset.role;
      page = MENUS[role][0].items[0][0];
      $('drawer').hidden = true;
      renderNav();
      renderPage();
    });
  });

  renderNav();
  renderPage();
</script>
