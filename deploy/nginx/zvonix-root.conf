# Основной домен проекта и www (ADR-0082, ADR-0049).
#
# Шаблон. deploy/server-setup.sh подставляет имена и кладёт результат
# в /etc/nginx/sites-available/zvonix-root; сайт включается, только если задан основной домен.
# Страницы сайта живут в приложении кабинета под /site; здесь они видны от корня: путь
# переписывается самим nginx (rewrite … break), приложение видит /site/<путь>. Переписывание
# средствами Next (proxy.ts) отвергнуто: на живой сборке запрос с таким правилом не отвечал вовсе.
# Статика приложения (/_next/, /fonts/, значок) одна у обоих адресов и не переписывается.
# Сертификат общий с кабинетом (`--cert-name`).
#   @@SERVER_NAME@@  домен кабинета (чей сертификат; куда ведут /api и вход)
#   @@SITE_NAMES@@   основной домен и www через пробел

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @@SITE_NAMES@@;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/@@SERVER_NAME@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@SERVER_NAME@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Входить и вызывать API на основном домене нечем: кабинет — на своём адресе.
    location /api/ {
        return 302 https://@@SERVER_NAME@@$request_uri;
    }

    location ~ ^/(_next/|fonts/|icon\.svg$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = / {
        rewrite ^ /site break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        rewrite ^/(.+)$ /site/$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
