# Сайт площадки: кабинет и API за одним адресом (ADR-0037, ADR-0049).
#
# Шаблон. deploy/server-setup.sh подставляет адрес и имя и кладёт результат
# в /etc/nginx/sites-available/zvonix. Правится здесь, а на сервер попадает повторным
# запуском подготовки — окружение и секреты она при этом не трогает.
#   @@LISTEN@@       127.0.0.1:8080 — стенд через SSH-туннель; 80 — когда есть домен
#   @@SERVER_NAME@@  домен или «_»

server {
    @@LISTEN@@
    server_name @@SERVER_NAME@@;
    # Версия nginx в ответах посетителю не нужна, а атакующему подсказывает.
    server_tokens off;

    # API. Завершающий слеш в proxy_pass отрезает префикс: /api/auth/me уходит как /auth/me.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # API верит X-Forwarded-For только от 127.0.0.1 (TRUSTED_PROXIES=loopback).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Кабинет ждёт ответа до 40 с (пробное письмо) — прокси обязан ждать дольше.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # API принимает тело до 256 КБ и на большее отвечает сам. Здесь предел с запасом,
        # чтобы отказ приходил от API с понятным текстом, а не страницей nginx.
        client_max_body_size 1m;
    }

    # Всё остальное — кабинет, включая его статику /_next/.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
