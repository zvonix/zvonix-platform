# Порт 80 площадки с доменом (ADR-0049, ревизия 2026-09-22).
#
# Шаблон. deploy/server-setup.sh подставляет домен и кладёт результат
# в /etc/nginx/sites-available/zvonix-acme. Кабинета по открытому http нет: здесь только
# проверка владения доменом для Let's Encrypt — при выпуске и при каждом продлении —
# и перенаправление на https.
#   @@SERVER_NAME@@   домен кабинета (адрес перенаправления)
#   @@SERVER_NAMES@@  все имена сертификата через пробел: кабинет, основной домен, www
#   @@REDIRECT_MAP@@  пары «имя https://имя;» для основного домена и www (пусто, если сайта нет)

# Куда вести с открытого порта. Основной домен и www — на себя же, на сайт: раньше всё вели на кабинет,
# и тот, кто набрал `zvonix.com` без https, видел вход в кабинет. Адрес назначения берётся из списка
# известных имён, а не из присланного заголовка Host: чужое имя уйдёт на кабинет, как прежде.
map $host $zvonix_https_target {
    default https://@@SERVER_NAME@@;
    @@REDIRECT_MAP@@
}

server {
    listen 80;
    listen [::]:80;
    server_name @@SERVER_NAMES@@;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 $zvonix_https_target$request_uri;
    }
}
