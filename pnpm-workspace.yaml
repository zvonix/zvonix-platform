packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 читает настройки отсюда, а не из поля "pnpm" в package.json.
# Сборочные скрипты разрешаются поимённо: по умолчанию pnpm их не выполняет.
# esbuild собирает свой бинарник — без него не запускается vitest.
# @swc/core нужен там же: esbuild не генерирует метаданные декораторов,
# без которых не собирается контейнер зависимостей NestJS.
allowBuilds:
  '@swc/core': true
  esbuild: true
  # Нативный ускоритель msgpack, который bullmq тянет транзитивно. Отказ явный,
  # а не по умолчанию: без него msgpackr работает на чистом JS, а полезная нагрузка
  # наших заданий — несколько полей, то есть ускорять нечего. Выполнять сборочный
  # скрипт зависимости ради этого — лишняя поверхность.
  msgpackr-extract: false

# drizzle-kit тянет esbuild через устаревшие пакеты @esbuild-kit/*, застрявшие
# на версии с известной уязвимостью (GHSA-67mh-4wv8-2f99). Она касается только
# режима `esbuild --serve`, которым drizzle-kit не пользуется, но оставлять
# известную уязвимость в гейте нельзя: её начнут игнорировать вместе с остальными.
# Убрать, когда drizzle-kit перестанет зависеть от @esbuild-kit.
overrides:
  esbuild: '>=0.25.0'
  # brace-expansion приходит транзитивно через eslint и minimatch; в обеих ветках версий
  # отказ в обслуживании на вложенных скобках (GHSA-qhr7-859c-m2p7 и соседние, 2026-09-30).
  # Затрагивает только разбор шаблонов линтером, но гейт уязвимостей не пропускает.
  # Убрать, когда eslint и minimatch подтянут исправленные версии сами.
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'
  # source-map-js (через postcss: vite, vitest, next) — отказ в обслуживании на разборе карт исходников
  # (GHSA-68fv-2mgg-jv7q, 2026-10-06); smol-toml (через knip) — квадратичный разбор (GHSA-r4xh-jqrq-34v2).
  # Оба — только сборка и разработка, но гейт уязвимостей не пропускает. Убрать, когда родители подтянут сами.
  'source-map-js@<1.2.2': '1.2.2'
  'smol-toml@<1.8.1': '1.9.0'
  # shell-quote приходит через concurrently (только запуск dev-команд): внедрение команд через перевод строки
  # (GHSA-pqg4-j6r4-53mv, 2026-10-06). Убрать, когда concurrently подтянет исправленную версию.
  'shell-quote@>=1.8.4 <1.11.0': '1.11.0'
  # zod (через knip и напрямую) — исчерпание памяти на огромных коллекциях с ограничениями (GHSA zod <4.6.6, 2026-10-27);
  # fast-uri (через fastify и ajv) — разбор адресов (GHSA-wjr9-j795-jxcr). Прямые зависимости подняты в package.json,
  # переопределение — для транзитивных копий. Убрать, когда knip и fastify подтянут исправленные версии сами.
  'zod@<4.6.6': '^4.6.6'
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
  'fast-uri@>=4.0.0 <4.2.3': '^4.2.3'
  # fastify (через @nestjs/platform-fastify) — обход проверки заголовков (GHSA-389g-gv7q-r4x8, 2026-10-31). Прямая
  # зависимость поднята в apps/api, переопределение — для копии Nest. Убрать, когда Nest подтянет сам.
  'fastify@>=5.12.2 <5.12.6': '^5.12.6'
  # minimatch 10 (через typescript-eslint) — отказ в обслуживании на разборе шаблона (GHSA-g3hv-75wg-m249,
  # 2026-10-30), исправлено только в 11; программный интерфейс 10 и 11 одинаков. Только линтер. Убрать, когда
  # typescript-eslint подтянет 11 сам.
  'minimatch@>=10.0.0 <11.0.1': '^11.0.3'

# Принятые предупреждения аудита — только с проверенной причиной, почему не касаются проекта.
auditConfig:
  ignoreGhsas:
    # GHSA-g3hv-75wg-m249 объявлен на все minimatch <11.0.1, но уязвимый код (firstPhasePreProcess,
    # optimizationLevel) появился в ветке 9; копия 3.1.5 у eslint и @eslint/eslintrc его не содержит, а поднять её
    # до 11 нельзя — они вызывают модуль как функцию. Копию 10.x переопределение выше заменяет на 11.
    # Убрать, когда eslint уйдёт с minimatch 3.
    - GHSA-g3hv-75wg-m249
