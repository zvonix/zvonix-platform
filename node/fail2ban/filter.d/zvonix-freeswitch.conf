# Фильтр fail2ban для неудачных входов на узел по SIP — **чужие логины** (ADR-0051, ревизия).
#
# Штатный filter.d/freeswitch.conf на FreeSWITCH 1.10.12 не поймал ни одной строки
# из 64 тысяч (2026-09-22): после времени эта версия пишет загрузку процессора
# («11.43%»), а режим фильтра по умолчанию не смотрит на неудачи пароля вовсе.
# Строка, которую ловит этот фильтр:
#
#   2026-09-22 16:16:03.452260 11.43% [WARNING] sofia_reg.c:1787 SIP auth failure (REGISTER)
#     on sofia profile 'zvonix' for [150@78.17.98.160] from ip 51.15.21.79
#
# Каждая такая попытка — запрос учётной записи у площадки: один сканер с сотней
# попыток в секунду занимал половину процессора API.
#
# **Логины площадки (`gw-`, `ch-`, `pt-` и двенадцать знаков) здесь не считаются**
# (владелец, 2026-09-25). Сканер перебирает чужие имена — `100`, `1001`, `admin`, — а шлюз
# партнёра с ошибкой в пароле повторяет своё. Раньше такой шлюз за двадцать минут
# закрывал весь офис партнёра от площадки, включая кабинет, где он и мог бы увидеть
# ошибку. Свои логины считает отдельный фильтр zvonix-freeswitch-known с порогом атаки.

[Definition]
# Дату fail2ban находит по datepattern и вырезает из строки до сравнения — в образцах
# её нет. «%%» — так в настройках fail2ban пишется один знак процента.
failregex = ^\s*\d+(?:\.\d+)?%% \[WARNING\] sofia_reg\.c:\d+ SIP auth failure \((?:REGISTER|INVITE)\) on sofia profile '[^']+' for \[(?!(?:gw|ch|pt)-[0-9a-z]{12}@)[^\]]*\] from ip <HOST>$
            ^\s*\d+(?:\.\d+)?%% \[WARNING\] sofia_reg\.c:\d+ Can't find user \[(?!(?:gw|ch|pt)-[0-9a-z]{12}@)[^\]]*\] from <HOST>$

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S\.%%f
