# Фильтр fail2ban для неудачных входов на узел по SIP — **чужие логины** (ADR-0051, ревизия; ADR-0125).
#
# Штатный filter.d/freeswitch.conf на FreeSWITCH 1.10.12 не поймал ни одной строки
# из 64 тысяч (2026-09-22): после времени эта версия пишет загрузку процессора
# («11.43%»), а режим фильтра по умолчанию не смотрит на неудачи пароля вовсе.
# Строки, которые ловит этот фильтр:
#
#   2026-09-22 16:16:03.452260 11.43% [WARNING] sofia_reg.c:1787 SIP auth failure (REGISTER)
#     on sofia profile 'zvonix' for [150@78.17.98.160] from ip 51.15.21.79
#   … [WARNING] sofia_reg.c:3203 Can't find user [100@78.17.98.160] from 51.15.21.79
#
# Каждая такая попытка — запрос учётной записи у площадки: один сканер с сотней
# попыток в секунду занимал половину процессора API.
#
# **Логины площадки — всё, что начинается с `gw-`, `ch-`, `pt-`, — здесь не считаются**
# (владелец, 2026-09-25). Сканер перебирает чужие имена — `100`, `1001`, `admin`, — а шлюз
# партнёра с ошибкой в пароле повторяет своё. Свои логины считает отдельный фильтр
# zvonix-freeswitch-known с порогом атаки. По началу, а не по полной форме: логин
# с опечаткой — пропущенным или лишним знаком — тоже свой.
#
# **`SIP auth failure (INVITE)` здесь не считается** (ADR-0125): у INVITE в скобках стоит
# номер назначения, а не логин. 18.11.2026 таймауты каталога у живого клиента дали пять
# строк «auth failure (INVITE) … for [+79330980320@…]» за час — номер не начинается
# с `ch-`, и клиент получил блок на сутки. Неудачи INVITE считает zvonix-freeswitch-known;
# сканер с чужим логином через INVITE и так попадает сюда строкой «Can't find user».

[Definition]
# Дату fail2ban находит по datepattern и вырезает из строки до сравнения — в образцах
# её нет. «%%» — так в настройках fail2ban пишется один знак процента.
failregex = ^\s*\d+(?:\.\d+)?%% \[WARNING\] sofia_reg\.c:\d+ SIP auth failure \(REGISTER\) on sofia profile '[^']+' for \[(?!(?:gw|ch|pt)-[^@\]]*@)[^\]]*\] from ip <HOST>$
            ^\s*\d+(?:\.\d+)?%% \[WARNING\] sofia_reg\.c:\d+ Can't find user \[(?!(?:gw|ch|pt)-[^@\]]*@)[^\]]*\] from <HOST>$

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S\.%%f
