# Фильтр fail2ban для неудачных входов по SIP под **логинами площадки** (ADR-0051, ревизия
# 2026-09-25; ADR-0125): всё, что начинается с `gw-`, `ch-`, `pt-`, включая логин с опечаткой.
#
# Такие неудачи почти всегда — шлюз партнёра со старым паролем: он повторяет один и тот же
# логин раз в минуту на линию. Блокировать его за это нельзя — вместе с ним закрывается
# весь офис партнёра (владелец, 2026-09-25). Но и не считать вовсе нельзя: имена
# не секрет, и поток попыток под ними так же нагружает площадку, как под чужими. Поэтому
# тот же поиск, что у чужих логинов, но под отдельную тюрьму с порогом атаки.
#
# **Сюда же — все `SIP auth failure (INVITE)`** (ADR-0125): в скобках у INVITE номер
# назначения, по нему логин не узнать. Неверный пароль к существующей линии даёт только
# эту строку — она считается здесь, и подбор пароля через INVITE упирается в порог атаки
# (пароль линии — 32 знака: на этом пороге его не подобрать). Таймаут каталога у живого
# клиента («Can't find user [ch-…]» и следом auth failure INVITE) тоже считается здесь,
# а не блокирует клиента на сутки, как 18.11.2026.

[Definition]
failregex = ^\s*\d+(?:\.\d+)?%% \[WARNING\] sofia_reg\.c:\d+ SIP auth failure \(REGISTER\) on sofia profile '[^']+' for \[(?:gw|ch|pt)-[^@\]]*@[^\]]*\] from ip <HOST>$
            ^\s*\d+(?:\.\d+)?%% \[WARNING\] sofia_reg\.c:\d+ SIP auth failure \(INVITE\) on sofia profile '[^']+' for \[[^\]]*\] from ip <HOST>$
            ^\s*\d+(?:\.\d+)?%% \[WARNING\] sofia_reg\.c:\d+ Can't find user \[(?:gw|ch|pt)-[^@\]]*@[^\]]*\] from <HOST>$

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S\.%%f
