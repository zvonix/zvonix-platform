# Фильтр fail2ban для неудачных входов по SIP под **логинами площадки** (ADR-0051, ревизия
# 2026-09-25): `gw-`, `ch-`, `pt-` и двенадцать знаков.
#
# Такие неудачи почти всегда — шлюз партнёра со старым паролем: он повторяет один и тот же
# логин раз в минуту на линию. Блокировать его за это нельзя — вместе с ним закрывается
# весь офис партнёра (владелец, 2026-09-25). Но и не считать вовсе нельзя: имена
# не секрет, и поток попыток под ними так же нагружает площадку, как под чужими. Поэтому
# тот же поиск, что у чужих логинов, но под отдельную тюрьму с порогом атаки.

[Definition]
failregex = ^\s*\d+(?:\.\d+)?%% \[WARNING\] sofia_reg\.c:\d+ SIP auth failure \((?:REGISTER|INVITE)\) on sofia profile '[^']+' for \[(?:gw|ch|pt)-[0-9a-z]{12}@[^\]]*\] from ip <HOST>$
            ^\s*\d+(?:\.\d+)?%% \[WARNING\] sofia_reg\.c:\d+ Can't find user \[(?:gw|ch|pt)-[0-9a-z]{12}@[^\]]*\] from <HOST>$

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S\.%%f
