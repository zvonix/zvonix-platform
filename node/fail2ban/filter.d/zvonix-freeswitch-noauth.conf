# Фильтр fail2ban для INVITE без пароля (ADR-0127).
#
# Сканер номеров шлёт INVITE на номера вида `712810217197114163@217.197.114.163`, получает 407 и пароль
# не называет. 18–19.11.2026 так делал 37.187.220.233: 1848 INVITE за сутки, по одному в 30 секунд. Строки
# «SIP auth failure» у такого звонка нет, и две другие SIP-тюрьмы его не видят. Канал ждёт INVITE с паролем
# 10 секунд и бросается. Поток таких INVITE занимает сеансы FreeSWITCH (sessions-per-second 30), и настоящим
# клиентам приходит отказ.
#
# Строку пишет не FreeSWITCH, а служба узла zvonix-sip-noauth в /var/log/zvonix/sip-noauth.log. Она связывает
# по uuid канала адрес из «receiving invite from» со строкой «Abandoned» того же канала, в которой адреса нет:
#
#   2026-11-19 04:45:01.519633 INVITE без авторизации от 37.187.220.233
#
# Настоящий клиент на 407 отвечает INVITE с паролем, его канал уходит в диалплан и не бросается — такой строки
# у него не бывает: из 849 звонков 94.198.51.21 за 18–19.11 брошенных 0. Неверный пароль — не брошенный канал:
# его считает тюрьма zvonix-freeswitch-known строкой «SIP auth failure (INVITE)».

[Definition]
# Дату fail2ban находит по datepattern и вырезает из строки до сравнения — в образцах её нет.
failregex = ^\s*INVITE без авторизации от <HOST>$

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S\.%%f
