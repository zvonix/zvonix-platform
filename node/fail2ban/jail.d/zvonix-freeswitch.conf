# Блокировка подбора паролей SIP на узле (ADR-0051, ревизия 2026-09-22).
#
# Порождается установщиком узла — правится в репозитории, node/fail2ban/, а не здесь.
#
# Зачем. Каждая неудачная попытка регистрации — это запрос учётной записи у площадки,
# то есть HTTP и чтение базы. Один сканер с 51.15.21.79 дал больше сотни попыток
# в секунду: API занял половину процессора, база четверть, свободным осталось десять
# процентов. Это способ положить площадку, не трогая её саму.
#
# Двадцать неудач за десять минут — порог, при котором сканер попадает под блокировку
# за доли секунды, а шлюз партнёра с ошибкой в пароле переживает несколько попыток.
# Закрывается адрес целиком, на час: SIP ходит по UDP, и закрывать один порт мало.
# Снять раньше: fail2ban-client set zvonix-freeswitch unbanip <адрес>

[zvonix-freeswitch]
enabled = true
filter = zvonix-freeswitch
backend = auto
logpath = @@FREESWITCH_LOG@@
maxretry = 20
findtime = 10m
bantime = 1h
banaction = nftables[type=allports]
protocol = tcp, udp
