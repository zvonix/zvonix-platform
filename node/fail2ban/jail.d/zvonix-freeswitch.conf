# Блокировка подбора паролей SIP на узле (ADR-0051, ревизии 2026-09-22 и 2026-09-25).
#
# Порождается установщиком узла — правится в репозитории, node/fail2ban/, а не здесь.
#
# Зачем. Каждая неудачная попытка регистрации — это запрос учётной записи у площадки,
# то есть HTTP и чтение базы. Один сканер с 51.15.21.79 дал больше сотни попыток
# в секунду: API занял половину процессора, база четверть, свободным осталось десять
# процентов. Это способ положить площадку, не трогая её саму.
#
# **Закрывается только порт SIP 5060, TCP и UDP, а не адрес целиком** (2026-09-25).
# Партнёр, ошибившийся в пароле GOIP, раньше терял вместе со звонками и кабинет — там,
# где он мог бы увидеть, что линия не на связи. Нагрузку создаёт именно SIP: закрыть его
# достаточно, чтобы площадка перестала получать запросы учётных записей.
#
# Снять раньше: fail2ban-client set <тюрьма> unbanip <адрес>

# Чужие логины — сканеры. Пять неудач за час — блок на сутки (решение владельца
# 2026-09-25; было двадцать за десять минут и час): живой шлюз под чужим логином не ходит
# вовсе, а партнёр с опечаткой в логине теряет только звонки, кабинет ему открыт.
[zvonix-freeswitch]
enabled = true
filter = zvonix-freeswitch
backend = auto
logpath = @@FREESWITCH_LOG@@
maxretry = 5
findtime = 1h
bantime = 24h
banaction = nftables[type=multiport]
port = 5060
protocol = tcp, udp

# Логины площадки — почти всегда шлюз партнёра со старым паролем (владелец, 2026-09-25).
# Порог — атака, а не ошибка: GoIP32 со старым паролем на всех линиях и перерегистрацией
# раз в минуту даёт 320 неудач за десять минут. 1200 — две попытки в секунду, чего живое
# устройство не делает (ужесточено владельцем 2026-09-25, было 6000).
[zvonix-freeswitch-known]
enabled = true
filter = zvonix-freeswitch-known
backend = auto
logpath = @@FREESWITCH_LOG@@
maxretry = 1200
findtime = 10m
bantime = 1h
banaction = nftables[type=multiport]
port = 5060
protocol = tcp, udp
