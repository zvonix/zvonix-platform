# Подбор паролей SSH: три неудачи за десять минут — блок на час; каждое следующее нарушение того же адреса
# блокирует дольше по ступеням: час → сутки → неделя → месяц → год (решение владельца 2026-10-15).
# Файл порождается node/install.sh из шаблона — правится там.
# Свой адрес не блокировать: ZVONIX_SSH_ALLOW_IPS="1.2.3.4 5.6.7.0/24" при установке.
# Заблокировали себя — консоль хостинга и `fail2ban-client unban <адрес>`.
[sshd]
enabled = true
maxretry = 3
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.multipliers = 1 24 168 720 8760
bantime.maxtime = 53w
