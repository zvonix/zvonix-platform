# Подбор паролей SSH: три неудачи за десять минут — блок на час, повторные нарушители блокируются всё дольше
# (час, два, четыре… до недели). Файл порождается node/install.sh из шаблона — правится там.
# Своя блокировка снимается с консоли хостинга: fail2ban-client unban <адрес>.
[sshd]
enabled = true
maxretry = 3
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 1w
