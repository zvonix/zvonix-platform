# CI гоняет те же проверки, что и локально, но на Ubuntu — той же ОС, что в production.
# Это основной механизм, который ловит расхождения до мержа: регистр в именах файлов,
# пути, нативные зависимости.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Выпуск вызывает этот же процесс перед сборкой архива: выпуск без пройденного гейта
  # не собирается (ADR-0049).
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Интеграционным тестам нужна реальная база (ADR-0006). Версия совпадает
    # с production: различия в поведении PostgreSQL между мажорными версиями
    # проявляются именно в том, что проверяют эти тесты — ограничениях и типах.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zvonix
          POSTGRES_PASSWORD: zvonix
          POSTGRES_DB: zvonix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zvonix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Расписание фоновых задач (ADR-0020). Версия совпадает с production.
      # Политика вытеснения обязана быть noeviction: при любой другой Redis выбрасывает
      # ключи заданий молча, и воркер отказывается запускаться — это проверяется.
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      TEST_DATABASE_URL: postgresql://zvonix:zvonix@127.0.0.1:5432/zvonix_test
      # База не нулевая: проверки очищают её целиком.
      TEST_REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - uses: actions/checkout@v4

      # Версия pnpm берётся из `packageManager` в package.json. Здесь её не повторяем:
      # копия разошлась — стояла 9 при закреплённой 11.5.0, и CI ставил бы другое дерево.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Браузер для сквозных проверок кабинета. Без него шаг «Кабинет в браузере»
      # отчитается «НЕ ВЫПОЛНЕН» — и проверка, ради которой CI и заведён, молча
      # перестанет что-либо проверять. `--with-deps` ставит системные библиотеки,
      # которых в образе Ubuntu нет.
      - name: Браузер для сквозных проверок
        run: pnpm exec playwright install --with-deps chromium

      # Всё содержимое гейта — внутри check.sh, включая соответствие миграций схеме,
      # смоук собранного приложения и аудит зависимостей. Отдельных шагов здесь
      # нет намеренно: проверка, которая есть только в CI, не запускается локально
      # и потому находит проблемы позже всех.
      - name: Полная проверка
        run: bash scripts/check.sh

  # Проверка, которую нельзя пройти на Windows: имена файлов, отличающиеся только регистром.
  case-sensitivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Конфликты регистра в именах файлов
        run: |
          dupes=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Файлы, различающиеся только регистром — сломают сборку на Ubuntu:"
            echo "$dupes"
            exit 1
          fi
          echo "Конфликтов регистра нет."
