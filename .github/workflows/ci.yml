# CI гоняет те же проверки, что и локально, но на Ubuntu — той же ОС, что в production.
# Это основной механизм, который ловит расхождения до мержа: регистр в именах файлов,
# пути, нативные зависимости.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Интеграционным тестам нужна реальная база (ADR-0006). Версия совпадает
    # с production: различия в поведении PostgreSQL между мажорными версиями
    # проявляются именно в том, что проверяют эти тесты — ограничениях и типах.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zvonix
          POSTGRES_PASSWORD: zvonix
          POSTGRES_DB: zvonix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zvonix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://zvonix:zvonix@127.0.0.1:5432/zvonix_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Всё содержимое гейта — внутри check.sh, включая соответствие миграций схеме,
      # смоук собранного приложения и аудит зависимостей. Отдельных шагов здесь
      # нет намеренно: проверка, которая есть только в CI, не запускается локально
      # и потому находит проблемы позже всех.
      - name: Полная проверка
        run: bash scripts/check.sh

  # Проверка, которую нельзя пройти на Windows: имена файлов, отличающиеся только регистром.
  case-sensitivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Конфликты регистра в именах файлов
        run: |
          dupes=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Файлы, различающиеся только регистром — сломают сборку на Ubuntu:"
            echo "$dupes"
            exit 1
          fi
          echo "Конфликтов регистра нет."
